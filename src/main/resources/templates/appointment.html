<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--  <title>Appointment Management</title>-->
    <!-- Bootstrap and Argon CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/argon-dashboard-free/assets/css/argon-dashboard.css" rel="stylesheet">
    <link href="../static/css/appointment.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fe;
            color: #525f7f;
        }
        .side-nav {
            height: 100vh;
            background-color: #5e72e4;
            color: white;
            position: fixed;
            width: 240px;
            padding-top: 20px;
        }
        .side-nav a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 15px 20px;
            border-radius: 0.375rem;
        }
        .side-nav a:hover {
            background-color: #324cdd;
        }
        .content {
            margin-left: 260px;
            padding: 20px;
        }
        h1, h2 {
            color: #5e72e4;
            margin-bottom: 20px;
        }
        .btn-primary {
            background-color: #5e72e4;
            border: none;
        }
        .btn-primary:hover {
            background-color: #324cdd;
        }
        .btn-danger {
            background-color: #f5365c;
            border: none;
        }
        .btn-danger:hover {
            background-color: #d21f3c;
        }
        .table thead {
            background-color: #5e72e4;
            color: white;
        }
        .table-hover tbody tr:hover {
            background-color: #f6f9fc;
        }
        .card {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
<!-- Side Navigation Bar -->
<div class="side-nav">
    <!--  <h4 class="text-center">Appointment App</h4>-->
    <a href="#myProfile">My Profile</a>
    <a href="#scheduleAppointment">Schedule Appointment</a>
    <a href="#prescriptions">Prescriptions</a>
</div>

<!-- Main Content -->
<div class="content">
    <!-- Patient ID Section -->
    <div id="patientInfo">
        <h1>Patient Dashbroard</h1>
        <div class="card shadow">
            <div class="card-body">
                <p><strong>Patient ID:</strong> <span id="patientIdDisplay">12345</span></p>
                <p><strong>Patient Name:</strong> John Doe</p>
            </div>
        </div>
    </div>

    <!-- Scheduled Appointments Section -->
    <div id="scheduledAppointments">
        <h2>Scheduled Appointments</h2>
        <div class="card shadow">
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Staff ID</th>
                        <th>Date</th>
                        <th>Reason</th>
                        <th>Type</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody id="appointmentTable">
                    <!-- Appointments will be dynamically inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const baseUrl = "http://localhost:8080/appointments"; // Replace with your backend URL

    // Fetch and display scheduled appointments
    function fetchAppointments() {
        fetch(baseUrl)
            .then(response => response.json())
            .then(appointments => {
                const tableBody = document.getElementById('appointmentTable');
                tableBody.innerHTML = ''; // Clear the table
                appointments.forEach(appointment => {
                    const row = `
              <tr>
                <td>${appointment.appointmentId}</td>
                <td>${appointment.staffId}</td>
                <td>${appointment.appointmentDate}</td>
                <td>${appointment.reason}</td>
                <td>${appointment.appointmentType}</td>
                <td>
                  <button class="btn btn-danger btn-sm" onclick="deleteAppointment(${appointment.appointmentId})">Delete</button>
                </td>
              </tr>
            `;
                    tableBody.innerHTML += row;
                });
            })
            .catch(error => console.error('Error fetching appointments:', error));
    }

    // Delete a scheduled appointment
    function deleteAppointment(id) {
        if (confirm('Are you sure you want to delete this appointment?')) {
            fetch(`${baseUrl}/${id}`, { method: 'DELETE' })
                .then(() => {
                    alert('Appointment deleted successfully!');
                    fetchAppointments(); // Refresh the table
                })
                .catch(error => console.error('Error deleting appointment:', error));
        }
    }

    // Initial fetch of appointments
    fetchAppointments();
</script>
</body>
</html>
