<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', fetchAppointments);

    function fetchAppointments() {
        fetch('/appointments') // Ensure this is the correct API endpoint
            .then(response => response.json())
            .then(data => {
                console.log('Appointments data:', data);
                const tableBody = document.getElementById('appointments-table-body');
                tableBody.innerHTML = ''; // Clear any existing rows

                const today = new Date(); // Get today's date
                const todaysAppointments = data.filter(appointment => {
                    // Parse the appointment date into a Date object
                    const appointmentDate = new Date(appointment.appointmentDate.replace(' ', 'T')); // Replace space with 'T' for ISO format

                    // Check if the appointment date matches today's date
                    return (
                        appointmentDate.getFullYear() === today.getFullYear() &&
                        appointmentDate.getMonth() === today.getMonth() &&
                        appointmentDate.getDate() === today.getDate()
                    );
                });

                if (todaysAppointments.length === 0) {
                    tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center">No appointments for today.</td>
                    </tr>
                `;
                    return;
                }

                let serialNumber = 1;

                todaysAppointments.forEach(appointment => {
                    const row = `
                    <tr>
                        <td>${serialNumber++}</td>
                        <td>${appointment.patientId || 'N/A'}</td>
                        <td>${appointment.staffId || 'N/A'}</td>
                        <td>${appointment.appointmentDate.split(' ')[0] || 'N/A'}</td>
                        <td>${appointment.timeFrom || 'N/A'} - ${appointment.timeTo || 'N/A'}</td>
                        <td>${appointment.status || 'N/A'}</td>
                        <td>${appointment.reason || 'N/A'}</td>
                    </tr>
                `;
                    tableBody.innerHTML += row;
                });
            })
            .catch(err => {
                console.error('Error fetching appointments:', err);
                alert('Failed to load appointments.');
            });
    }
</script>
