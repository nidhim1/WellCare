<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Patient Profile</title>
  <!-- Favicon -->
  <link href="../assets/img/brand/favicon.png" rel="icon" type="image/png">
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet">
  <!-- Icons -->
  <link href="../assets/js/plugins/nucleo/css/nucleo.css" rel="stylesheet" />
  <link href="../assets/js/plugins/@fortawesome/fontawesome-free/css/all.min.css" rel="stylesheet" />
  <!-- CSS Files -->
  <link href="../assets/css/argon-dashboard.css?v=1.1.2" rel="stylesheet" />
</head>

<body class="">
<!-- Sidenav -->
<nav class="navbar navbar-vertical fixed-left navbar-expand-md navbar-light bg-white" id="sidenav-main">
  <!-- Add navigation content here -->
</nav>

<div class="main-content">
  <!-- Navbar -->
  <nav class="navbar navbar-top navbar-expand-md navbar-dark" id="navbar-main">
    <!-- Add navbar content here -->
  </nav>

  <!-- Header -->
  <div class="header pb-8 pt-5 pt-lg-8 d-flex align-items-center"
       style="min-height: 600px; background-image: url(../static/img/theme/profile-cover.jpg); background-size: cover; background-position: center top;">
    <span class="mask bg-gradient-default opacity-8"></span>
    <div class="container-fluid d-flex align-items-center">
      <div class="row">
        <div class="col-lg-7 col-md-10">
          <h1 class="display-2 text-white">Patient Profile</h1>
          <p class="text-white mt-0 mb-5">View and update patient information including personal, contact, and insurance details.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Page content -->
  <div class="container-fluid mt--7">
    <div class="row">
      <div class="col-xl-4 order-xl-2 mb-5 mb-xl-0">
        <div class="card card-profile shadow">
          <div class="row justify-content-center">
            <div class="col-lg-3 order-lg-2">
              <div class="card-profile-image">
                <a href="#">
                  <img src="../assets/img/theme/team-4-800x800.jpg" class="rounded-circle">
                </a>
              </div>
            </div>
          </div>
          <div class="card-body pt-0 pt-md-4">
            <div class="text-center">
              <h3>Patient ID: <span id="patientId">12345</span></h3>
              <h4><span id="firstName">John</span> <span id="lastName">Doe</span></h4>
              <div class="h5 font-weight-300">
                <input type="text" id="email-patient" class="form-control form-control-alternative" placeholder="example@example.com">
                , <span id="country">USA</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-xl-8 order-xl-1">
        <div class="card bg-secondary shadow">
          <div class="card-header bg-white border-0">
            <h3 class="mb-0">Patient Details</h3>
          </div>
          <div class="card-body">
            <form>
              <h6 class="heading-small text-muted mb-4">Contact Information</h6>
              <div class="pl-lg-4">
                <div class="row">
                  <div class="col-lg-6">
                    <div class="form-group">
                      <label class="form-control-label" for="email">Email</label>
                      <input type="email" id="email" class="form-control form-control-alternative" placeholder="example@example.com">
                    </div>
                  </div>
                  <div class="col-lg-6">
                    <div class="form-group">
                      <label class="form-control-label" for="phone">Phone</label>
                      <input type="text" id="phone" class="form-control form-control-alternative" placeholder="123-456-7890">
                    </div>
                  </div>
                </div>
              </div>

              <h6 class="heading-small text-muted mb-4">Address Information</h6>
              <div class="pl-lg-4">
                <div class="row">
                  <div class="col-lg-6">
                    <div class="form-group">
                      <label class="form-control-label" for="address">Address</label>
                      <input type="text" id="address" class="form-control form-control-alternative" placeholder="123 Street">
                    </div>
                  </div>
                  <div class="col-lg-3">
                    <div class="form-group">
                      <label class="form-control-label" for="city">City</label>
                      <input type="text" id="city" class="form-control form-control-alternative" placeholder="City">
                    </div>
                  </div>
                  <div class="col-lg-3">
                    <div class="form-group">
                      <label class="form-control-label" for="postalCode">Postal Code</label>
                      <input type="text" id="postalCode" class="form-control form-control-alternative" placeholder="12345">
                    </div>
                  </div>
                </div>
              </div>

              <h6 class="heading-small text-muted mb-4">Insurance Information</h6>
              <div class="pl-lg-4">
                <div class="row">
                  <div class="col-lg-6">
                    <div class="form-group">
                      <label class="form-control-label" for="insuranceProvider">Provider</label>
                      <input type="text" id="insuranceProvider" class="form-control form-control-alternative" placeholder="Insurance Co.">
                    </div>
                  </div>
                  <div class="col-lg-6">
                    <div class="form-group">
                      <label class="form-control-label" for="insuranceNumber">Number</label>
                      <input type="text" id="insuranceNumber" class="form-control form-control-alternative" placeholder="12345-67890">
                    </div>
                  </div>
                </div>
              </div>

              <div class="text-right">
                <button type="submit" class="btn btn-primary">Update Profile</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <!-- Add footer content here -->
    </footer>
  </div>
</div>

<!-- Core -->
<script src="../assets/js/plugins/jquery/dist/jquery.min.js"></script>
<script src="../assets/js/plugins/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<!-- Argon JS -->
<script src="../assets/js/argon-dashboard.min.js?v=1.1.2"></script>
</body>

</html>
